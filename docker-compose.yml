services:
  app:
    build: .
    user: "${WCS_UID:-1000}:${WCS_GID:-1000}"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WCS_PORT:-8000}:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      WEBCHANGESENTINEL_CONFIG: /app/config/config.yaml
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/sentinel.db}
      MONITOR_PROXY: ${MONITOR_PROXY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    shm_size: 256mb
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webchangesentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
