[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webchangesentinel"
version = "0.1.0"
description = "Configurable web change monitoring with a local dashboard and multi-channel alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.28,<1",
  "imagehash>=4.3,<5",
  "jinja2>=3.1.6,<4",
  "lxml>=5.3,<7",
  "pillow>=11,<13",
  "playwright>=1.51,<2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "python-telegram-bot>=22,<23",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy>=2.0.38,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
desktop = ["plyer>=2.1,<3"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
webchangesentinel = "webchangesentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webchangesentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
